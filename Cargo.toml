[package]
name = "rshunterbtt"
version = "0.1.0"
edition = "2021"

[features]
default = ["mockall"]

[dependencies]
tokio = { version = "1", features = ["full"] }
btleplug = "0.11"
rumqttc = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
influxdb = { version = "0.7", features = ["use-serde"] }
uuid = "1.0"
dbus = { version = "0.9", features = ["vendored"] }
mockall = { version = "0.13", optional = true }
hex = "0.4"
futures = "0.3"
libc = "0.2"

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
